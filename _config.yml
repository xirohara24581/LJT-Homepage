# Welcome to Jekyll!
#
# This config file is meant for settings that affect your entire site, values
# which you are expected to set up once and rarely need to edit after that.
# For technical reasons, this file is *NOT* reloaded automatically when you use
# `jekyll serve -l -H localhost`. If you change this file, please restart the 
# server process.

# Basic Site Settings
locale                   : "en-US"
site_theme               : "default" # The available themes options are "default", "air", "sunrise", "mint", "dirt" and "contrast"
title                    : "Junteng Liu"
title_separator          : "-"
name                     : &name "Junteng Liu"
description              : &description "Junteng Liu's academic homepage"
url                      : https://xirohara24581.github.io
baseurl                  : "/LJT-Homepage"
repository               : "xirohara24581/LJT-Homepage"

# Site Author
author:
  # Biographic information
  avatar           : "profile.png"
  name             : "Junteng Liu"
  pronouns         :
  bio              : "First-year PhD candidate at HKUST NLP Group."
  location         : "Hong Kong"
  employer         : "Hong Kong University of Science and Technology"
  uri              :
  email            : "jliugi@connect.ust.hk"

  # Academic websites
  academia         :
  arxiv            :
  googlescholar    : "https://scholar.google.com/citations?hl=en&user=tbK9jl4AAAAJ&view_op=list_works&sortby=pubdate"
  inspire-hep      :
  impactstory      :
  orcid            :
  semantic         :
  ssrn             :
  pubmed           :
  researchgate     :
  scopus           :
  zotero           :


  # Repositories and software development
  bitbucket        :
  codepen          :
  dribbble         :
  github           : "Vicent0205"
  kaggle           :
  stackoverflow    :

  # Social media
  artstation       :
  bluesky          :
  facebook         :
  flickr           :
  foursquare       :
  goodreads        :
  google_plus      :
  keybase          :
  instagram        :
  lastfm           :
  linkedin         :
  mastodon         :
  medium           :
  pinterest        :
  soundcloud       :
  steam            :
  telegram         :
  tumblr           :
  twitter          : "junteng88716710"
  vine             :
  weibo            :
  wikipedia        :
  xing             :
  youtube          :
  zhihu            :

# Publication Category - The following the list of publication categories and their headings
publication_category:
  books:
    title: 'Books'
  manuscripts:
    title: 'Journal Articles'    
  conferences:
    title: 'Conference Papers'

# Site Settings
teaser                   :
breadcrumbs              : false
words_per_minute         : 160
future                   : true
read_more                : "disabled"
talkmap_link             : false
comments:
  provider               :
  disqus:
    shortname            :
  discourse:
    server               :
  facebook:
    appid                :
    num_posts            :
    colorscheme          :
staticman:
  allowedFields          : ['name', 'email', 'url', 'message']
  branch                 : "gh-pages"
  commitMessage          : "New comment."
  filename               : comment-{@timestamp}
  format                 : "yml"
  moderation             : true
  path                   : "_data/comments/{options.slug}"
  requiredFields         : ['name', 'email', 'message']
  transforms:
    email                : "md5"
  generatedFields:
    date:
      type               : "date"
      options:
        format           : "iso8601"
atom_feed:
  hide                   : false
  path                   :


# SEO Related
google_site_verification :
bing_site_verification   :
alexa_site_verification  :
yandex_site_verification :


# Social Sharing
twitter:
  username               : &twitter
facebook:
  username               :
  app_id                 :
  publisher              :
og_image                 :
og_description           :
social:
  type                   :
  name                   :
  links:


# Analytics
analytics:
  provider               :  "false"
  google:
    tracking_id          :


# Reading Files
include:
  - .htaccess
  - _pages
  - files
exclude:
  - "*.sublime-project"
  - "*.sublime-workspace"
  - .asset-cache
  - .bundle
  - .github
  - .jekyll-assets-cache
  - .sass-cache
  - assets/js/_main.js
  - assets/js/plugins
  - assets/js/vendor
  - CHANGELOG
  - Capfile
  - config
  - Dockerfile
  - Gemfile
  - Gruntfile.js
  - gulpfile.js
  - LICENSE
  - local
  - log
  - node_modules
  - package.json*
  - Rakefile
  - README
  - tmp
  - vendor
keep_files:
  - .git
  - .svn
encoding: "utf-8"
markdown_ext: "markdown,mkdown,mkdn,mkd,md"


# Conversion
markdown: kramdown
highlighter: rouge
lsi: false
excerpt_separator: "\n\n"
incremental: false


# Markdown Processing
kramdown:
  input: GFM
  hard_wrap: false
  auto_ids: true
  footnote_nr: 1
  entity_output: as_char
  toc_levels: 1..6
  smart_quotes: lsquo,rsquo,ldquo,rdquo
  enable_coderay: false


# These settings control the types of collections used by the template
collections:
  teaching:
    output: true
    permalink: /:collection/:path/
  publications:
    output: true
    permalink: /:collection/:path/
  portfolio:
    output: true
    permalink: /:collection/:path/
  talks:
    output: true
    permalink: /:collection/:path/


# These settings control how pages and collections are included in the site
defaults:
  # _posts
  - scope:
      path: ""
      type: posts
    values:
      layout: single
      author_profile: true
      read_time: true
      comments: true
      share: true
      related: true
  # _pages
  - scope:
      path: ""
      type: pages
    values:
      layout: single
      author_profile: true
  # _teaching
  - scope:
      path: ""
      type: teaching
    values:
      layout: single
      author_profile: true
      share: true
      comments: true
  # _publications
  - scope:
      path: ""
      type: publications
    values:
      layout: single
      author_profile: true
      share: true
      comments: true
  # _portfolio
  - scope:
      path: ""
      type: portfolio
    values:
      layout: single
      author_profile: true
      share: true
      comment: true
  # _talks
  - scope:
      path: ""
      type: talks
    values:
      layout: talk
      author_profile: true
      share: true


# Sass/SCSS
sass:
  sass_dir: _sass
  style: compressed

# Outputting
permalink: /:categories/:year/:month/:day/:title/
timezone:

# Plugins (previously gems:)
plugins:
  - jekyll-paginate
  - jekyll-sitemap
  - jekyll-gist
  - jekyll-feed
  - jekyll-include-cache

# mimic GitHub Pages with --safe
whitelist:
  - jekyll-paginate
  - jekyll-sitemap
  - jekyll-gist
  - jekyll-feed
  - jekyll-include-cache

# Archives
#  Type
#  - GitHub Pages compatible archive pages built with Liquid ~> type: liquid (default)
#  - Jekyll Archives plugin archive pages ~> type: jekyll-archives
#  Path (examples)
#  - Archive page at /archive, post archives at /yyyy, /yyyy/mm, etc ~> path: /:categories/:year/:month
#  - Archive page at /posts, post archives at /posts/yyyy, etc ~> path: /posts/:year/:month
#  - Archive page at /blog, post archives at /blog/yyyy, etc ~> path: /blog/:year/:month
#  - Archive page at /news, post archives at /news/yyyy, etc ~> path: /news/:year/:month
#  - Archive page at /articles, post archives at /articles/yyyy, etc ~> path: /articles/:year/:month
#  - Archive page at /drafts, post archives at /drafts/yyyy, etc ~> path: /drafts/:year/:month
#  - Archive page at /events, post archives at /events/yyyy, etc ~> path: /events/:year/:month
#  - Archive page at /publications, post archives at /publications/yyyy, etc ~> path: /publications/:year/:month
#  - Archive page at /software, post archives at /software/yyyy, etc ~> path: /software/:year/:month
#  - Archive page at /talks, post archives at /talks/yyyy, etc ~> path: /talks/:year/:month
#  - Archive page at /teaching, post archives at /teaching/yyyy, etc ~> path: /teaching/:year/:month
#  - Archive page at /work, post archives at /work/yyyy, etc ~> path: /work/:year/:month
#  - Archive page at /cv, post archives at /cv/yyyy, etc ~> path: /cv/:year/:month
#  - Archive page at /about, post archives at /about/yyyy, etc ~> path: /about/:year/:month
#  - Archive page at /contact, post archives at /contact/yyyy, etc ~> path: /contact/:year/:month
#  - Archive page at /faq, post archives at /faq/yyyy, etc ~> path: /faq/:year/:month
#  - Archive page at /terms, post archives at /terms/yyyy, etc ~> path: /terms/:year/:month
#  - Archive page at /markdown, post archives at /markdown/yyyy, etc ~> path: /markdown/:year/:month
#  - Archive page at /page-archive, post archives at /page-archive/yyyy, etc ~> path: /page-archive/:year/:month
#  - Archive page at /category-archive, post archives at /category-archive/yyyy, etc ~> path: /category-archive/:year/:month
#  - Archive page at /tag-archive, post archives at /tag-archive/yyyy, etc ~> path: /tag-archive/:year/:month
#  - Archive page at /collection-archive, post archives at /collection-archive/yyyy, etc ~> path: /collection-archive/:year/:month
#  - Archive page at /archive-layout-with-content, post archives at /archive-layout-with-content/yyyy, etc ~> path: /archive-layout-with-content/:year/:month
#  - Archive page at /non-menu-page, post archives at /non-menu-page/yyyy, etc ~> path: /non-menu-page/:year/:month
#  - Archive page at /portfolio, post archives at /portfolio/yyyy, etc ~> path: /portfolio/:year/:month
#  - Archive page at /talkmap, post archives at /talkmap/yyyy, etc ~> path: /talkmap/:year/:month
#  - Archive page at /cv-json, post archives at /cv-json/yyyy, etc ~> path: /cv-json/:year/:month
#  - Archive page at /sitemap, post archives at /sitemap/yyyy, etc ~> path: /sitemap/:year/:month
#  - Archive page at /404, post archives at /404/yyyy, etc ~> path: /404/:year/:month

category_archive:
  type: liquid
  path: /categories/
tag_archive:
  type: liquid
  path: /tags/

# HTML Compression
# - https://jch.penibelst.de/
compress_html:
  clippings: all
  ignore:
    envs: development

# Defaults
defaults:
  # _posts
  - scope:
      path: ""
      type: posts
    values:
      layout: single
      author_profile: true
      read_time: true
      comments: true
      share: true
      related: true
